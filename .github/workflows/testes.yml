name: Testes
on:
  push:
    branches: [main]
    paths: ['docs/core.js', 'scripts/**', 'supabase/**', 'test/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      # o relatório de lesões da NBA a sério (só para ver nos registos se o PDF se lê bem; não falha os testes)
      - run: 'node scripts/nba-injury.mjs || echo "::warning::relatório da NBA não se leu"'

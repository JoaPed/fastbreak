name: Testes
on:
  push:
    branches: [main]
    paths: ['docs/core.js', 'scripts/**', 'supabase/**', 'test/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test

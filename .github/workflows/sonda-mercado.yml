name: Sonda mercado
on:
  workflow_dispatch:
    inputs:
      q: { description: 'jogador:escalão', default: 'nikola-jokic:Rare', required: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - run: node scripts/probe-market.mjs "${{ inputs.q }}"

name: Odds dos jogadores
on:
  schedule:
    # hora UTC (= Lisboa no inverno; no verão é +1 h). O GitHub às vezes atrasa.
    # SportsGameOdds grátis: 2.500 jogos/mês; cada jogo lido conta 1. A The Odds API só entra nas datas sem linhas.
    - cron: '7 7 * * *'          # 7h: hoje e amanhã (vê se já há linhas para os jogos da noite seguinte)
    - cron: '7 16 * * *'         # 16h: hoje e amanhã
    - cron: '7 18-23,0-3 * * *'  # de hora a hora à noite: só lê (uma vez) quando faltam ≤ 2 h para o 1.º jogo, e avisa o grupo
  workflow_dispatch:
    inputs:
      dates: { description: 'Datas AAAA-MM-DD separadas por espaço (vazio = hoje e amanhã)', default: '', required: false }
      only_sgo: { description: 'Só SportsGameOdds (não gasta créditos da The Odds API)', type: boolean, default: false }
concurrency: { group: odds, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
      ODDS_ONLY_SGO: ${{ inputs.only_sgo && '1' || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - run: node scripts/sync-odds.mjs ${{ github.event.schedule == '7 18-23,0-3 * * *' && '--pre' || inputs.dates }}

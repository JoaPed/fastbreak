name: Odds dos jogadores
on:
  schedule:
    # uma vez por dia (plano grátis: 500 créditos/mês, ~1 por jogo): 14:07 UTC, que o GitHub costuma atrasar umas
    # horas; chega a meio da tarde em Lisboa, com as linhas de pontos já publicadas e antes dos jogos
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      dates: { description: 'Datas AAAA-MM-DD separadas por espaço (vazio = hoje e amanhã)', default: '', required: false }
concurrency: { group: odds, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - run: node scripts/sync-odds.mjs ${{ inputs.dates }}

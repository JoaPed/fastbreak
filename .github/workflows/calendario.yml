name: Calendário e médias NBA
on:
  schedule:
    # o GitHub tem atrasado as tarefas agendadas várias horas: quem a acorda à hora certa é o Supabase (pg_cron, em
    # supabase/schema.sql: 06:13, 09:17 e 12:13 UTC); estas ficam de reserva
    - cron: '13 7 * * *'     # 07:13 UTC (os jogos da noite já acabaram)
    - cron: '17 9 * * *'     # 09:17 UTC
    - cron: '13 12 * * *'    # 12:13 UTC
  workflow_dispatch:
concurrency: { group: stats, cancel-in-progress: false }
permissions: { contents: write, pages: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - run: node scripts/sync-schedule.mjs
      - run: node scripts/sync-stats.mjs
      # jogos da NBA na Sport TV e o canal (guia da Sport TV → odds_days.players._tv)
      - run: 'node scripts/sync-tv.mjs || echo "::warning::Sport TV falhou"'
      # fotos dos jogadores no próprio site (para a imagem do lineup que se partilha)
      - name: Fotos dos jogadores
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          node scripts/sync-heads.mjs || echo "::warning::fotos: falhou"
          if [ -n "$(git status --porcelain docs/heads)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/heads && git commit -q -m "Fotos dos jogadores (tarefa das médias)" && git pull -q --rebase && git push -q
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
          fi

name: Mercado
on:
  schedule:
    - cron: '11,41 * * * *'   # de meia em meia hora (o GitHub salta alguns; a tarefa apanha o que falta)
  workflow_dispatch:
concurrency: { group: mercado, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      # O GitHub salta muitos arranques agendados: a tarefa fica a correr (~5 h 40) e lê o mercado de 5 em 5 minutos
      # (sem esperar enquanto está atrasada); no fim lança-se outra vez.
      - name: Preços do mercado
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            rm -f .loop; LOOP_FILE=.loop node scripts/sync-market.mjs || echo "::warning::a volta falhou; tento outra vez"
            [ "$(cat .loop 2>/dev/null)" = 1 ] || sleep 300
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/mercado.yml/dispatches" -f ref="$GITHUB_REF_NAME" || true

name: Mercado
on:
  schedule:
    - cron: '11,41 * * * *'   # de meia em meia hora (o GitHub salta alguns; a tarefa apanha o que falta)
  workflow_dispatch:
concurrency: { group: mercado, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      # lê o mercado até ficar em dia (cada volta até 60 000 blocos, ~17 h); se ainda faltar, lança-se outra vez
      - name: Preços do mercado
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for i in $(seq 1 12); do
            rm -f .loop; LOOP_FILE=.loop node scripts/sync-market.mjs || exit 1
            [ "$(cat .loop 2>/dev/null)" = 1 ] || exit 0
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/mercado.yml/dispatches" -f ref="$GITHUB_REF_NAME" || true

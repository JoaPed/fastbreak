name: Lesões
on:
  schedule:
    - cron: '7,37 13-20 * * *'          # de meia em meia hora à tarde (UTC)
    - cron: '7,22,37,52 21-23 * * *'    # de 15 em 15 minutos à noite: lembrete, ponto da situação e última chamada
    - cron: '7,22,37,52 0-3 * * *'
  workflow_dispatch:
concurrency: { group: lesoes, cancel-in-progress: false }
permissions: { contents: read, actions: write }   # actions: write para se voltar a lançar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      # O GitHub salta muitos dos arranques agendados. Por isso, enquanto houver jogos por começar hoje, a tarefa
      # repete-se sozinha de 5 em 5 minutos (até ~5 h 40) e, se ainda faltar, lança-se outra vez antes de acabar.
      - name: Lesões e avisos (de 5 em 5 min enquanto houver jogos por começar)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while :; do
            rm -f .loop
            LOOP_FILE=.loop node scripts/sync-injuries.mjs || echo "::warning::a volta falhou; tento outra vez daqui a 5 min"
            [ "$(cat .loop 2>/dev/null)" = 1 ] || exit 0
            if [ "$(date +%s)" -ge "$end" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/lesoes.yml/dispatches" -f ref="$GITHUB_REF_NAME" || true; exit 0; fi
            sleep 300
          done

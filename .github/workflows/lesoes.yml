name: Lesões
on:
  schedule:
    - cron: '7,37 13-20 * * *'          # de meia em meia hora à tarde (UTC)
    - cron: '7,22,37,52 21-23 * * *'    # de 15 em 15 minutos à noite: lembrete, ponto da situação e última chamada
    - cron: '7,22,37,52 0-3 * * *'
  workflow_dispatch:
concurrency: { group: lesoes, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - run: node scripts/sync-injuries.mjs

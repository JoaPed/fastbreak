name: Sonda Top Shot
on:
  workflow_dispatch:
    inputs:
      methods: { description: "Métodos (Serviço/Método, separados por vírgulas); vazio = lista base", default: "", required: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev
      - run: node scripts/probe-topshot.mjs "${{ inputs.methods }}"
